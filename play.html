<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play - Lotto Winners USA</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .container{
            max-width:900px;
            margin:40px auto;
            text-align:center;
        }

        .balls{
            display:flex;
            justify-content:center;
            gap:15px;
            flex-wrap:wrap;
            margin:30px 0;
        }

        .ball{
            width:70px;
            height:70px;
            border-radius:50%;
            background:#FFD700;
            color:#0d2b6b;
            display:flex;
            justify-content:center;
            align-items:center;
            font-size:28px;
            font-weight:bold;
        }

        .ticket-box{
            background:#fff;
            color:#222;
            max-width:500px;
            margin:40px auto;
            padding:25px;
            border-radius:12px;
        }

        .play-btn{
            background:#FFD700;
            color:#0d2b6b;
            border:none;
            padding:12px 25px;
            border-radius:8px;
            font-size:18px;
            cursor:pointer;
        }

        #jackpot{
            color:#00ff66;
            font-size:24px;
            font-weight:bold;
            margin-top:20px;
        }
    </style>
</head>

<body>

<header>
    <h1>Lotto Winners USA</h1>

    <nav>
        <a href="index.html">Home</a> |
        <a href="play.html">Play</a> |
        <a href="results.html">Results</a>
    </nav>
</header>

<section class="container">

<h2>Pick 5 Numbers</h2>

<button onclick="draw()" class="play-btn">
Run Demo Draw
</button>

<div id="balls" class="balls"></div>

<p id="jackpot"></p>

<div class="ticket-box">

<h2>Your Demo Ticket</h2>

<p>Ticket ID: #LW-2026-00125</p>

<p>Entry Fee: <strong>$5.00</strong></p>

<p>Status: <span style="color:green;">Active</span></p>

<button class="play-btn" onclick="alert('Demo ticket confirmed!')">
Confirm Demo Ticket
</button>

</div>

</section>

<script>
function draw(){

    let s = new Set();

    while(s.size < 5){
        s.add(Math.floor(Math.random()*90)+1);
    }

    let numbers=[...s].sort((a,b)=>a-b);

    document.getElementById("balls").innerHTML=
    numbers.map(n=>`<div class="ball">${String(n).padStart(2,"0")}</div>`).join("");

    document.getElementById("jackpot").innerHTML=
    "🎉 Demo Jackpot: <strong>$450,000,000</strong><br>Good Luck!";
}
</script>

</body>
</html>

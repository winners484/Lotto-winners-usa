<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play - Lotto Winners USA</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>Lotto Winners USA</h1>

    <nav>
        <a href="index.html">Home</a>
        <a href="play.html">Play</a>
        <a href="results.html">Results</a>
    </nav>
</header>

<section class="container">
    <h2>Pick 5 Numbers</h2>

    <button onclick="draw()">Run Demo Draw</button>

    <div id="output" class="balls"></div>

<p id="message"></p>
<div class="ticket-box">
    <h2>Your Demo Ticket</h2>

    <p>Ticket ID: #LW-2026-00125</p>

    <p>Entry Fee: <strong>$5.00</strong></p>

    <p>Status:
        <span style="color:#00ff66;">Active</span>
    </p>

    <button class="play-btn">
        Confirm Demo Ticket
    </button>
</div>

<script>

function draw() {
    let s = new Set();

    while (s.size < 5) {
        s.add(Math.floor(Math.random() * 90) + 1);
    }

    let numbers = [...s].sort((a, b) => a - b);

    document.getElementById("balls").innerHTML =
        numbers.map(n => `<div class="ball">${String(n).padStart(2,'0')}</div>`).join("");

    document.getElementById("output").textContent = "";

    document.getElementById("jackpot").innerHTML =
        "🎉 <strong>Congratulations!</strong><br>" +
        "Demo Jackpot: <span style='color:#00ff66'>$450,000,000</span><br>" +
        "Good Luck!";
}

</script>

</body>
</html>

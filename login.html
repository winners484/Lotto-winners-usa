<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Lotto Winners USA</title>

<link rel="stylesheet" href="style.css">

<style>
.login-box{
    max-width:420px;
    margin:60px auto;
    background:white;
    padding:30px;
    border-radius:12px;
    color:#222;
    box-shadow:0 5px 15px rgba(0,0,0,.2);
}

.login-box h2{
    text-align:center;
    color:#0d2b6b;
    margin-bottom:20px;
}

.login-box input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
    box-sizing:border-box;
}

.login-btn{
    width:100%;
    padding:14px;
    background:#FFD700;
    color:#0d2b6b;
    border:none;
    border-radius:8px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

.note{
    margin-top:20px;
    text-align:center;
    font-size:14px;
}
</style>

</head>

<body>

<header>
<h1>Lotto Winners USA</h1>

<nav>
<a href="index.html">Home</a> |
<a href="play.html">Play</a> |
<a href="results.html">Results</a> |
<a href="login.html">Login</a>
</nav>
</header>

<div class="login-box">

<h2>Member Login</h2>

<input type="email" id="email" placeholder="Email Address">

<input type="password" id="password" placeholder="Password">

<button class="login-btn" onclick="login()">
Sign In
</button>

<p class="note">
Demo website – no real account is required.
</p>

</div>

<script>
function login(){

let email=document.getElementById("email").value;

if(email===""){
alert("Please enter your email address.");
return;
}

alert("Welcome to Lotto Winners USA (Demo)!");

window.location.href="play.html";

}
</script>

</body>
</html>

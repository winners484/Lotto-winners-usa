<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Lotto Winners USA</title>

<link rel="stylesheet" href="style.css">

<style>
body{
    font-family:Arial, sans-serif;
    background:#0d2b6b;
    color:white;
}

.login-box{
    max-width:420px;
    margin:60px auto;
    background:white;
    color:#222;
    padding:30px;
    border-radius:12px;
}

.login-box h2{
    text-align:center;
    color:#0d2b6b;
}

.login-box input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:8px;
    box-sizing:border-box;
}

.login-btn{
    width:100%;
    padding:14px;
    background:#FFD700;
    color:#071b44;
    border:none;
    border-radius:8px;
    font-size:18px;
    cursor:pointer;
}
</style>

</head>

<body>

<div class="login-box">

<h2>Member Login</h2>

<input type="email" id="email" placeholder="Email Address">

<input type="password" id="password" placeholder="Password">

<button class="login-btn" onclick="login()">
Sign In
</button>

</div>

<script>
function login() {

    let email = document.getElementById("email").value;
    let password = document.getElementById("password").value;

    if(email === ""){
        alert("Please enter your email address.");
        return;
    }

    if(password === ""){
        alert("Please enter your password.");
        return;
    }

    alert("Welcome to Lotto Winners USA (Demo)!");

    window.location.href = "dashboard.html";
}
</script>

</body>
</html>

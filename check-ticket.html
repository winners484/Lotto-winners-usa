<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Check My Ticket - Lotto Winners USA</title>

<link rel="stylesheet" href="style.css">

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#0d2b6b;
    color:white;
}

header{
    background:#071b44;
    padding:20px;
    text-align:center;
}

.container{
    max-width:700px;
    margin:40px auto;
    background:white;
    color:#071b44;
    padding:30px;
    border-radius:12px;
    text-align:center;
    box-shadow:0 10px 20px rgba(0,0,0,.2);
}

input{
    width:100%;
    padding:12px;
    margin:15px 0;
    font-size:16px;
    border:1px solid #ccc;
    border-radius:8px;
    box-sizing:border-box;
}

button{
    background:#FFD700;
    color:#071b44;
    border:none;
    padding:14px 30px;
    border-radius:8px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#ffea66;
}

#result{
    margin-top:30px;
    text-align:left;
    display:none;
    background:#f4f4f4;
    color:#071b44;
    padding:20px;
    border-radius:10px;
}
</style>
</head>

<body>

<header>
<h1>🎟️ Check My Ticket</h1>
</header>

<div class="container">

<h2>Enter Your Demo Ticket Number</h2>

<input
type="text"
id="ticket"
placeholder="Example: LW-2026-00125">

<button onclick="checkTicket()">
Check Ticket
</button>

<div id="result"></div>

</div>

<script>
function checkTicket(){

    let ticket = document.getElementById("ticket").value.trim().toUpperCase();

    let result = document.getElementById("result");

    if(ticket === ""){
        alert("Please enter a ticket number.");
        return;
    }

    result.style.display = "block";

    if(ticket === "LW-2026-00125"){

        result.innerHTML = `
        <h3>✅ Ticket Found</h3>
        <p><strong>Ticket:</strong> LW-2026-00125</p>
        <p><strong>Game:</strong> USA 5/90</p>
        <p><strong>Numbers:</strong> 08, 17, 34, 52, 89</p>
        <p><strong>Status:</strong> Winner</p>
        <p><strong>Prize:</strong> $450,000,000 (Demo)</p>`;
        <p><strong>Prize:</strong> $450,000,000 (Demo)</p>
<button onclick="window.print()">
🖨️ Print Demo Ticket
</button>

    } else {

        result.innerHTML = `
        <h3>❌ Ticket Not Found</h3>
        <p>No demo ticket matches <strong>${ticket}</strong>.</p>
        <p>Please check the ticket number and try again.</p>`;
    }
}
</script>

</body>
</html>
